<style>
:root{
  --char:#2F3440;
  --char-2:#4A515F;
  --muted:#8A909B;
  --coral:#EC8B96;
  --coral-dk:#DE6D7C;
  --coral-soft:#FAE0E3;
  --blush:#FDF6F7;
  --line:#EDE9EA;
  --disp:'Montserrat',-apple-system,'Segoe UI',sans-serif;
  --body:'Karla',-apple-system,'Segoe UI',Helvetica,sans-serif;
}
*{box-sizing:border-box}
html{height:100%}
body{min-height:100%}
body{
  margin:0;
  font-family:var(--body);
  color:var(--char);
  background:
    radial-gradient(90% 70% at 78% 6%,#FDF1F2 0%,rgba(253,246,247,0) 60%),
    radial-gradient(70% 60% at 10% 100%,#FBF3F4 0%,rgba(255,255,255,0) 62%),
    #fff;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
.glow{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.g1{width:520px;height:520px;background:#FAD7DC;opacity:.5;top:-220px;right:-150px}
.g2{width:380px;height:380px;background:#F6E7E9;opacity:.55;bottom:-190px;left:-160px}

main{
  position:relative;z-index:1;
  flex:1;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;
  padding:48px 24px;
}
.inner{width:min(620px,100%)}

.mark{
  width:min(330px,74vw);height:auto;margin:0 auto 40px;display:block;
  filter:drop-shadow(0 24px 44px rgba(47,52,64,.12));
  opacity:0;transform:translateY(10px);
  animation:rise .9s cubic-bezier(.2,.7,.3,1) .05s forwards;
}

.rule{
  width:120px;height:2px;margin:0 auto 30px;
  background:var(--coral);
  transform:scaleX(0);transform-origin:center;
  animation:draw .8s cubic-bezier(.2,.7,.3,1) .5s forwards;
}

h1{
  font-family:var(--disp);font-weight:300;
  font-size:clamp(27px,4.4vw,40px);
  letter-spacing:-.015em;line-height:1.22;
  margin:0 0 18px;
  opacity:0;animation:rise .8s cubic-bezier(.2,.7,.3,1) .28s forwards;
}
p.lede{
  font-size:17px;line-height:1.7;color:var(--char-2);
  max-width:46ch;margin:0 auto;
  opacity:0;animation:rise .8s cubic-bezier(.2,.7,.3,1) .42s forwards;
}

@keyframes rise{to{opacity:1;transform:none}}
@keyframes draw{to{transform:scaleX(1)}}

a:focus-visible{outline:2px solid var(--coral-dk);outline-offset:3px}

@media (prefers-reduced-motion: reduce){
  .mark,h1,p.lede{opacity:1;transform:none;animation:none}
  .rule{transform:scaleX(1);animation:none}
}
@media(max-width:560px){
  main{padding:40px 22px}
  .mark{margin-bottom:34px}
}
@media(max-height:640px){
  main{padding:32px 24px}
  .mark{width:min(232px,52vw);margin-bottom:24px}
  .rule{margin-bottom:22px}
  h1{font-size:clamp(23px,3.2vw,29px);margin-bottom:14px}
  p.lede{font-size:15.5px}
}
</style>
</head>
